name: Defender scan

# The scan itself lives in excelano/.github, so every repo in the fleet runs the
# same one and a correction reaches all of them at once. What stays here is when
# to run and which tag to scan: that is this repo's business, the policy is the
# fleet's. Same split as ci.yml and codeql.yml, and this file is byte-identical
# across every winget-shipping repo — change it there, not here.
#
# Why it exists: winget's `08. Installation Validation` installs the package and
# runs it, and a Defender flag at that step blocks the submission with no
# detection name published anywhere you can read. The called workflow reproduces
# that install-and-run under armed Defender before a manifest is ever submitted.
# Rationale and the failure modes are documented in the called workflow itself.
#
# Dispatch only, and deliberately. A `release: published` trigger sat here from
# 2026-08-18 to 2026-09-01 and never fired. It could not have: a release created
# by a workflow using the default GITHUB_TOKEN raises no event, the same
# suppression deb.yml documents and works around by hand. An automatic run is
# not wanted in any case. The scan checks a file at rest, it does not predict
# `08. Installation Validation`, and a clean run is not clearance — dispatch it
# when you want the at-rest check on a particular release, and read the result
# as one data point. See ~/notes/releasing.md.
on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to scan, e.g. v1.9.0"
        required: true
        type: string
      dynamic:
        description: "Also execute the binaries directly under armed Defender (deep diagnosis)"
        required: false
        default: false
        type: boolean
      rollback-definitions:
        description: "Roll Defender definitions back first (see the called workflow; usually void)"
        required: false
        default: false
        type: boolean

jobs:
  scan:
    uses: excelano/.github/.github/workflows/defender-scan.yml@main
    with:
      tag: ${{ inputs.tag }}
      dynamic: ${{ inputs.dynamic }}
      rollback-definitions: ${{ inputs.rollback-definitions }}
