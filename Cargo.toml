[package]
name = "xled"
homepage = "https://excelano.com/xled/"
version = "0.12.1"
edition = "2021"
description = "sed and awk for tabular data — regex transforms over Excel-style ranges on CSV/DSV"
license = "MIT"
authors = ["David M. Anderson"]
repository = "https://github.com/excelano/xled"
readme = "README.md"
keywords = ["csv", "sed", "awk", "tabular", "regex"]
categories = ["command-line-utilities", "text-processing"]

[dependencies]
regex = "1.13.1"
csv = "1.4.0"
clap = { version = "4.6.6", features = ["derive"] }
rustyline = "18.0.1"
encsniff = "0.2.0"
# Dates only — no times, no timezones (see expr-grammar.md, Dates). `clock` is carried solely for
# today(), which must read the local calendar day: a UTC-only build would name the wrong
# day for part of every day in most of the world.
chrono = { version = "0.4.38", default-features = false, features = ["std", "clock"] }
xaddr = "0.2.1"

[package.metadata.deb]
maintainer = "David M. Anderson <david.anderson@excelano.com>"
extended-description = """
xled is sed and awk for tabular data: awk's field model, sed's s/// substitution,
and ed's live in-memory buffer, applied to Excel-style ranges over CSV and DSV
files. It is stringly-typed with explicit casts (leading zeros and long IDs stay
intact), never reshapes the table, and previews every edit before you commit.
Part of the Excelano tabular family — four small tools split by what changes:
xray observes and changes nothing, xled edits cell values, xshape changes the
grid's shape, xql queries the row set."""
section = "utils"
priority = "optional"
depends = "libc6, libgcc-s1"
assets = [
    ["target/release/xled", "usr/bin/", "755"],
    ["README.md", "usr/share/doc/xled/README.md", "644"],
    ["LICENSE", "usr/share/doc/xled/copyright", "644"],
]

# The profile that 'dist' will build with
[profile.dist]
inherits = "release"
lto = "thin"
